[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mlws-ocr"
version = "0.12.0"
description = "A readable OCR reference implementation for scanned documents: a classic feature-based engine and a neural engine of self-trained networks"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-image>=0.22",
    "pillow>=10.1",
    "pypdf>=4",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
train = ["torch>=2.4"]   # optional: faster training (and inference on an accelerator); numpy is the reference

[project.scripts]
mlws-ocr = "mlws_ocr.cli:main"
mlws-ocr-ui = "mlws_ocr.cli:ui_main"
mlws-ocr-service = "mlws_ocr.service:main"
mlws-ocr-lab = "mlws_ocr.inspector.lab:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mlws_ocr = ["inspector/static/*", "workbench/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
