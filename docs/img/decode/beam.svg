<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" font-family="Helvetica, Arial, sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52606d"/></marker></defs><rect width="900" height="360" fill="#ffffff"/><text x="20" y="28" font-size="16" fill="#1f2933" text-anchor="start" font-weight="700">Beam search over a word: at each glyph, keep the best few partial readings</text><text x="130" y="62" font-size="12" fill="#52606d" text-anchor="middle" font-weight="400">glyph 1: its candidates</text><rect x="90" y="80" width="80" height="40" rx="8" fill="#e8f0fe" stroke="#9aa5b1" stroke-width="1.5"/><text x="130.0" y="105.25" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="600">E</text><rect x="90" y="140" width="80" height="40" rx="8" fill="#f5f7fa" stroke="#9aa5b1" stroke-width="1.5"/><text x="130.0" y="165.25" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="600">b</text><rect x="90" y="200" width="80" height="40" rx="8" fill="#f5f7fa" stroke="#9aa5b1" stroke-width="1.5"/><text x="130.0" y="225.25" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="600">L</text><text x="360" y="62" font-size="12" fill="#52606d" text-anchor="middle" font-weight="400">glyph 2: its candidates</text><rect x="320" y="80" width="80" height="40" rx="8" fill="#e8f0fe" stroke="#9aa5b1" stroke-width="1.5"/><text x="360.0" y="105.25" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="600">l</text><rect x="320" y="140" width="80" height="40" rx="8" fill="#f5f7fa" stroke="#9aa5b1" stroke-width="1.5"/><text x="360.0" y="165.25" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="600">1</text><rect x="320" y="200" width="80" height="40" rx="8" fill="#f5f7fa" stroke="#9aa5b1" stroke-width="1.5"/><text x="360.0" y="225.25" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="600">I</text><text x="590" y="62" font-size="12" fill="#52606d" text-anchor="middle" font-weight="400">glyph 3: its candidates</text><rect x="550" y="80" width="80" height="40" rx="8" fill="#e8f0fe" stroke="#9aa5b1" stroke-width="1.5"/><text x="590.0" y="105.25" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="600">m</text><rect x="550" y="140" width="80" height="40" rx="8" fill="#f5f7fa" stroke="#9aa5b1" stroke-width="1.5"/><text x="590.0" y="165.25" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="600">rn</text><rect x="550" y="200" width="80" height="40" rx="8" fill="#f5f7fa" stroke="#9aa5b1" stroke-width="1.5"/><text x="590.0" y="225.25" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="600">n</text><line x1="170" y1="100" x2="320" y2="100" stroke="#1f9d6b" stroke-width="3"/><line x1="400" y1="100" x2="550" y2="100" stroke="#1f9d6b" stroke-width="3"/><line x1="170" y1="160" x2="320" y2="100" stroke="#9aa5b1" stroke-width="1.5"/><line x1="400" y1="100" x2="550" y2="100" stroke="#9aa5b1" stroke-width="1.5"/><line x1="170" y1="100" x2="320" y2="160" stroke="#9aa5b1" stroke-width="1.5"/><line x1="400" y1="160" x2="550" y2="160" stroke="#9aa5b1" stroke-width="1.5"/><text x="20" y="290" font-size="12" fill="#52606d" text-anchor="start" font-weight="400">score = pixel evidence (each candidate's cost, softened into a probability) + 0.5 x language model (the character GRU) + priors</text><text x="20" y="310" font-size="12" fill="#52606d" text-anchor="start" font-weight="400">(height, baseline, punctuation position, case) ; 8 partial readings survive each step; at the end the lexicon may promote a known word</text><text x="20" y="330" font-size="12" fill="#52606d" text-anchor="start" font-weight="400">within 4 nats of the best. Split and merge variants of the word ('rn' or 'm') are decoded the same way and compete.</text></svg>
