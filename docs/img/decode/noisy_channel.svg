<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" font-family="Helvetica, Arial, sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52606d"/></marker></defs><rect width="900" height="300" fill="#ffffff"/><text x="20" y="28" font-size="16" fill="#1f2933" text-anchor="start" font-weight="700">The noisy channel: which word, sent through this engine's typical misreadings, best explains what came out?</text><rect x="30" y="80" width="170" height="60" rx="8" fill="#fde8e8" stroke="#9aa5b1" stroke-width="1.5"/><text x="115.0" y="107.9" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="600">'C)vertime'</text><text x="115.0" y="122.0" font-size="12" fill="#52606d" text-anchor="middle" font-weight="400">what the engine read</text><rect x="300" y="60" width="250" height="50" rx="8" fill="#fdf1e3" stroke="#9aa5b1" stroke-width="1.5"/><text x="425.0" y="82.9" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="600">'Overtime'</text><text x="425.0" y="97.0" font-size="12" fill="#52606d" text-anchor="middle" font-weight="400">undo 'O' → 'C)' (seen in harvests)</text><rect x="300" y="130" width="250" height="50" rx="8" fill="#f5f7fa" stroke="#9aa5b1" stroke-width="1.5"/><text x="425.0" y="152.9" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="600">'Covertime'</text><text x="425.0" y="167.0" font-size="12" fill="#52606d" text-anchor="middle" font-weight="400">not a word</text><line x1="200" y1="105" x2="298" y2="85" stroke="#52606d" stroke-width="1.6" marker-end="url(#ah)"/><line x1="200" y1="115" x2="298" y2="155" stroke="#52606d" stroke-width="1.6" marker-end="url(#ah)"/><rect x="640" y="60" width="230" height="50" rx="8" fill="#e6f6ef" stroke="#9aa5b1" stroke-width="1.5"/><text x="755.0" y="82.9" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="600">score</text><text x="755.0" y="97.0" font-size="12" fill="#52606d" text-anchor="middle" font-weight="400">log P(channel) + log P(word)</text><line x1="550" y1="85" x2="638" y2="85" stroke="#52606d" stroke-width="1.6" marker-end="url(#ah)"/><text x="30" y="220" font-size="12" fill="#52606d" text-anchor="start" font-weight="400">P(channel): how often the engine turns α into β, counted by reading 480 non-evaluation pages against their truth (Brill &amp; Moore 2000).</text><text x="30" y="240" font-size="12" fill="#52606d" text-anchor="start" font-weight="400">P(word): the lexicon's frequency. Accepted only if it beats the runner-up by a margin -- and if the word-strip network,</text><text x="30" y="260" font-size="12" fill="#52606d" text-anchor="start" font-weight="400">looking at the pixels again, does not find the new spelling much less likely (the pixel veto). Classic profile: 899 corrections, 2 wrong.</text></svg>
