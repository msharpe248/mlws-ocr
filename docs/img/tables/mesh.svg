<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" font-family="Helvetica, Arial, sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52606d"/></marker></defs><rect width="900" height="360" fill="#ffffff"/><text x="20" y="28" font-size="16" fill="#1f2933" text-anchor="start" font-weight="700">The junction mesh: whitespace gaps as virtual rules, joined where they make cells</text><text x="110" y="98" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="400">Item</text><text x="300" y="98" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="400">Qty</text><text x="380" y="98" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="400">Price</text><text x="490" y="98" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="400">Amount</text><text x="110" y="138" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="400">A487</text><text x="300" y="138" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="400">4</text><text x="380" y="138" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="400">12.50</text><text x="490" y="138" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="400">37.50</text><text x="110" y="178" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="400">A487</text><text x="300" y="178" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="400">5</text><text x="380" y="178" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="400">25.00</text><text x="490" y="178" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="400">75.00</text><text x="110" y="218" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="400">A487</text><text x="300" y="218" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="400">6</text><text x="380" y="218" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="400">37.50</text><text x="490" y="218" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="400">112.50</text><text x="110" y="258" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="400">A487</text><text x="300" y="258" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="400">7</text><text x="380" y="258" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="400">50.00</text><text x="490" y="258" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="400">150.00</text><line x1="240" y1="80" x2="240" y2="270" stroke="#1f9d6b" stroke-width="3"/><line x1="228" y1="80" x2="252" y2="80" stroke="#1f9d6b" stroke-width="2"/><line x1="228" y1="120" x2="252" y2="120" stroke="#1f9d6b" stroke-width="2"/><line x1="228" y1="160" x2="252" y2="160" stroke="#1f9d6b" stroke-width="2"/><line x1="228" y1="200" x2="252" y2="200" stroke="#1f9d6b" stroke-width="2"/><line x1="228" y1="240" x2="252" y2="240" stroke="#1f9d6b" stroke-width="2"/><line x1="228" y1="270" x2="252" y2="270" stroke="#1f9d6b" stroke-width="2"/><line x1="322" y1="80" x2="322" y2="270" stroke="#1f9d6b" stroke-width="3"/><line x1="310" y1="80" x2="334" y2="80" stroke="#1f9d6b" stroke-width="2"/><line x1="310" y1="120" x2="334" y2="120" stroke="#1f9d6b" stroke-width="2"/><line x1="310" y1="160" x2="334" y2="160" stroke="#1f9d6b" stroke-width="2"/><line x1="310" y1="200" x2="334" y2="200" stroke="#1f9d6b" stroke-width="2"/><line x1="310" y1="240" x2="334" y2="240" stroke="#1f9d6b" stroke-width="2"/><line x1="310" y1="270" x2="334" y2="270" stroke="#1f9d6b" stroke-width="2"/><line x1="432" y1="80" x2="432" y2="270" stroke="#1f9d6b" stroke-width="3"/><line x1="420" y1="80" x2="444" y2="80" stroke="#1f9d6b" stroke-width="2"/><line x1="420" y1="120" x2="444" y2="120" stroke="#1f9d6b" stroke-width="2"/><line x1="420" y1="160" x2="444" y2="160" stroke="#1f9d6b" stroke-width="2"/><line x1="420" y1="200" x2="444" y2="200" stroke="#1f9d6b" stroke-width="2"/><line x1="420" y1="240" x2="444" y2="240" stroke="#1f9d6b" stroke-width="2"/><line x1="420" y1="270" x2="444" y2="270" stroke="#1f9d6b" stroke-width="2"/><line x1="60" y1="120" x2="560" y2="120" stroke="#2f6fdf" stroke-width="1" stroke-dasharray="5 4"/><line x1="60" y1="160" x2="560" y2="160" stroke="#2f6fdf" stroke-width="1" stroke-dasharray="5 4"/><line x1="60" y1="200" x2="560" y2="200" stroke="#2f6fdf" stroke-width="1" stroke-dasharray="5 4"/><line x1="60" y1="240" x2="560" y2="240" stroke="#2f6fdf" stroke-width="1" stroke-dasharray="5 4"/><line x1="60" y1="270" x2="560" y2="270" stroke="#2f6fdf" stroke-width="1" stroke-dasharray="5 4"/><text x="620" y="90" font-size="13" fill="#1f9d6b" text-anchor="start" font-weight="400">green spines: a column gap chained down</text><text x="620" y="110" font-size="13" fill="#1f9d6b" text-anchor="start" font-weight="400">the rows; its teeth are the row gaps</text><text x="620" y="130" font-size="13" fill="#1f9d6b" text-anchor="start" font-weight="400">it crosses: an 'E' (3 or more teeth)</text><text x="620" y="170" font-size="13" fill="#2f6fdf" text-anchor="start" font-weight="400">blue: row gaps (virtual rules across)</text><text x="620" y="210" font-size="13" fill="#1f2933" text-anchor="start" font-weight="400">E's that share two or more teeth are</text><text x="620" y="230" font-size="13" fill="#1f2933" text-anchor="start" font-weight="400">one mesh; a mesh of two or more spines</text><text x="620" y="250" font-size="13" fill="#1f2933" text-anchor="start" font-weight="400">closes a cell -- a cycle of E's --</text><text x="620" y="270" font-size="13" fill="#1f2933" text-anchor="start" font-weight="400">and is a table. A single E is a list.</text><text x="20" y="340" font-size="12" fill="#52606d" text-anchor="start" font-weight="400">Real rules join the mesh as the strongest segments, so ruled, part-ruled and unruled tables are found by one mechanism.</text></svg>
