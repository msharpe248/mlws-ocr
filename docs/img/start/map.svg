ntation</text><text x="571.0" y="112.0" font-size="12" fill="#52606d" text-anchor="middle" font-weight="400">blocks, order, lines</text><line x1="642" y1="100" x2="658" y2="100" stroke="#52606d" stroke-width="1.6" marker-end="url(#ah)"/><rect x="660" y="70" width="142" height="60" rx="8" fill="#f3ecfd" stroke="#9aa5b1" stroke-width="1.5"/><text x="731.0" y="97.2" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="600">Recognition</text><text x="731.0" y="112.0" font-size="12" fill="#52606d" text-anchor="middle" font-weight="400">glyph to candidates</text><line x1="802" y1="100" x2="818" y2="100" stroke="#52606d" stroke-width="1.6" marker-end="url(#ah)"/><rect x="820" y="70" width="142" height="60" rx="8" fill="#f3ecfd" stroke="#9aa5b1" stroke-width="1.5"/><text x="891.0" y="97.2" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="600">Decoding</text><text x="891.0" y="112.0" font-size="12" fill="#52606d" text-anchor="middle" font-weight="400">candidates to words</text><rect x="500" y="190" width="142" height="60" rx="8" fill="#fdf1e3" stroke="#9aa5b1" stroke-width="1.5"/><text x="571.0" y="217.2" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="600">Tables</text><text x="571.0" y="232.0" font-size="12" fill="#52606d" text-anchor="middle" font-weight="400">rows, columns, cells</text><line x1="571" y1="130" x2="571" y2="188" stroke="#52606d" stroke-width="1.6" marker-end="url(#ah)"/><rect x="820" y="190" width="142" height="60" rx="8" fill="#fdf1e3" stroke="#9aa5b1" stroke-width="1.5"/><text x="891.0" y="217.2" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="600">hOCR</text><text x="891.0" y="232.0" font-size="12" fill="#52606d" text-anchor="middle" font-weight="400">what comes out</text><line x1="891" y1="130" x2="891" y2="188" stroke="#52606d" stroke-width="1.6" marker-end="url(#ah)"/><rect x="660" y="190" width="142" height="60" rx="8" fill="#fde8e8" stroke="#9aa5b1" stroke-width="1.5"/><text x="731.0" y="217