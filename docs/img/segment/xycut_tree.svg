<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" font-family="Helvetica, Arial, sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52606d"/></marker></defs><rect width="900" height="330" fill="#ffffff"/><text x="20" y="28" font-size="16" fill="#1f2933" text-anchor="start" font-weight="700">XY-cut is a recursion: cut at the widest gap, then cut each piece again</text><rect x="360" y="50" width="180" height="50" rx="8" fill="#e8f0fe" stroke="#9aa5b1" stroke-width="1.5"/><text x="450.0" y="79.9" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="600">the page</text><rect x="90" y="140" width="150" height="46" rx="8" fill="#e6f6ef" stroke="#9aa5b1" stroke-width="1.5"/><text x="165.0" y="167.9" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="600">title band</text><line x1="450" y1="100" x2="165" y2="138" stroke="#52606d" stroke-width="1.6" marker-end="url(#ah)"/><rect x="300" y="140" width="150" height="46" rx="8" fill="#e6f6ef" stroke="#9aa5b1" stroke-width="1.5"/><text x="375.0" y="167.9" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="600">column 1</text><line x1="450" y1="100" x2="375" y2="138" stroke="#52606d" stroke-width="1.6" marker-end="url(#ah)"/><rect x="510" y="140" width="150" height="46" rx="8" fill="#e6f6ef" stroke="#9aa5b1" stroke-width="1.5"/><text x="585.0" y="167.9" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="600">column 2</text><line x1="450" y1="100" x2="585" y2="138" stroke="#52606d" stroke-width="1.6" marker-end="url(#ah)"/><rect x="720" y="140" width="150" height="46" rx="8" fill="#e6f6ef" stroke="#9aa5b1" stroke-width="1.5"/><text x="795.0" y="167.9" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="600">column 3</text><line x1="450" y1="100" x2="795" y2="138" stroke="#52606d" stroke-width="1.6" marker-end="url(#ah)"/><text x="455" y="124" font-size="11" fill="#52606d" text-anchor="start" font-weight="400">cut across the page's gutters (x)</text><rect x="250" y="240" width="120" height="42" rx="8" fill="#fdf1e3" stroke="#9aa5b1" stroke-width="1.5"/><text x="310.0" y="265.9" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="600">heading</text><line x1="375" y1="186" x2="310" y2="238" stroke="#52606d" stroke-width="1.6" marker-end="url(#ah)"/><rect x="380" y="240" width="120" height="42" rx="8" fill="#fdf1e3" stroke="#9aa5b1" stroke-width="1.5"/><text x="440.0" y="265.9" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="600">paragraph</text><line x1="375" y1="186" x2="440" y2="238" stroke="#52606d" stroke-width="1.6" marker-end="url(#ah)"/><rect x="510" y="240" width="120" height="42" rx="8" fill="#fdf1e3" stroke="#9aa5b1" stroke-width="1.5"/><text x="570.0" y="265.9" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="600">paragraph</text><line x1="375" y1="186" x2="570" y2="238" stroke="#52606d" stroke-width="1.6" marker-end="url(#ah)"/><text x="20" y="316" font-size="12" fill="#52606d" text-anchor="start" font-weight="400">Depth-first order is the reading order: the title, then column 1 top to bottom, then column 2...</text></svg>
