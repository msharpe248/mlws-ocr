" font-size="13" fill="#1f2933" text-anchor="start" font-weight="400">mean B → A. Strong components need both</text><text x="430" y="250" font-size="13" fill="#1f2933" text-anchor="start" font-weight="400">ways, so a caption linked one way to a</text><text x="430" y="270" font-size="13" fill="#1f2933" text-anchor="start" font-weight="400">headline stays its own block.</text></svg>
