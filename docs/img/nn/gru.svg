<svg xmlns="http://www.w3.org/2000/svg" width="760" height="340" viewBox="0 0 760 340" font-family="Helvetica, Arial, sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52606d"/></marker></defs><rect width="760" height="340" fill="#ffffff"/><text x="20" y="28" font-size="16" fill="#1f2933" text-anchor="start" font-weight="700">A GRU cell: two gates decide how much of the old state to keep</text><rect x="30" y="150" width="110" height="50" rx="8" fill="#f3ecfd" stroke="#9aa5b1" stroke-width="1.5"/><text x="85.0" y="172.9" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="600">hₜ₋₁</text><text x="85.0" y="187.0" font-size="12" fill="#52606d" text-anchor="middle" font-weight="400">previous state</text><rect x="30" y="250" width="110" height="50" rx="8" fill="#e8f0fe" stroke="#9aa5b1" stroke-width="1.5"/><text x="85.0" y="272.9" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="600">xₜ</text><text x="85.0" y="287.0" font-size="12" fill="#52606d" text-anchor="middle" font-weight="400">this input</text><rect x="250" y="70" width="150" height="56" rx="8" fill="#f5f7fa" stroke="#9aa5b1" stroke-width="1.5"/><text x="325.0" y="95.9" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="600">update gate z</text><text x="325.0" y="110.0" font-size="12" fill="#52606d" text-anchor="middle" font-weight="400">σ(W_z x + U_z h + b)</text><rect x="250" y="150" width="150" height="56" rx="8" fill="#f5f7fa" stroke="#9aa5b1" stroke-width="1.5"/><text x="325.0" y="175.9" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="600">reset gate r</text><text x="325.0" y="190.0" font-size="12" fill="#52606d" text-anchor="middle" font-weight="400">σ(W_r x + U_r h + b)</text><rect x="230" y="240" width="200" height="64" rx="8" fill="#e6f6ef" stroke="#9aa5b1" stroke-width="1.5"/><text x="330.0" y="269.9" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="600">candidate c</text><text x="330.0" y="284.0" font-size="12" fill="#52606d" text-anchor="middle" font-weight="400">tanh(W_c x + U_c (r ⊙ h) + b)</text><rect x="510" y="150" width="200" height="64" rx="8" fill="#f3ecfd" stroke="#9aa5b1" stroke-width="1.5"/><text x="610.0" y="179.55" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="600">hₜ = (1 − z) ⊙ hₜ₋₁ + z ⊙ c</text><text x="610.0" y="194.0" font-size="12" fill="#52606d" text-anchor="middle" font-weight="400">a gated blend</text><line x1="140" y1="175" x2="250" y2="98" stroke="#d9e2ec" stroke-width="1.5"/><line x1="140" y1="175" x2="250" y2="178" stroke="#d9e2ec" stroke-width="1.5"/><line x1="140" y1="175" x2="250" y2="272" stroke="#d9e2ec" stroke-width="1.5"/><line x1="140" y1="275" x2="250" y2="98" stroke="#d9e2ec" stroke-width="1.5"/><line x1="140" y1="275" x2="250" y2="178" stroke="#d9e2ec" stroke-width="1.5"/><line x1="140" y1="275" x2="250" y2="272" stroke="#d9e2ec" stroke-width="1.5"/><line x1="400" y1="98" x2="560" y2="150" stroke="#52606d" stroke-width="1.6" marker-end="url(#ah)"/><line x1="325" y1="206" x2="325" y2="238" stroke="#52606d" stroke-width="1.6" marker-end="url(#ah)"/><line x1="430" y1="272" x2="560" y2="214" stroke="#52606d" stroke-width="1.6" marker-end="url(#ah)"/><path d="M 85 150 Q 85 70 200 58 Q 600 48 610 148" stroke="#7c4dcc" stroke-width="1.6" fill="none" marker-end="url(#ah)"/><text x="622" y="110" font-size="12" fill="#7c4dcc" text-anchor="start" font-weight="400">the old state passes</text><text x="622" y="126" font-size="12" fill="#7c4dcc" text-anchor="start" font-weight="400">straight through where z ≈ 0</text><text x="20" y="330" font-size="12" fill="#52606d" text-anchor="start" font-weight="400">The character language model runs one GRU forward (hidden 256); the line reader runs two, one each way along the line (hidden 96 each).</text></svg>
