<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="380" viewBox="0 0 1000 380" font-family="Helvetica, Arial, sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52606d"/></marker></defs><rect width="1000" height="380" fill="#ffffff"/><text x="20" y="28" font-size="16" fill="#1f2933" text-anchor="start" font-weight="700">The CRNN line reader: a line strip in, one character distribution per 2 pixels out</text><rect x="20" y="60" width="170" height="76" rx="8" fill="#e8f0fe" stroke="#9aa5b1" stroke-width="1.5"/><text x="105.0" y="95.9" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="600">strip</text><text x="105.0" y="110.0" font-size="12" fill="#52606d" text-anchor="middle" font-weight="400">32 × W × 1</text><text x="105.0" y="125.0" font-size="12" fill="#52606d" text-anchor="middle" font-weight="400">ink, x-height 13 px</text><line x1="190" y1="98" x2="216" y2="98" stroke="#52606d" stroke-width="1.6" marker-end="url(#ah)"/><rect x="216" y="60" width="170" height="76" rx="8" fill="#e6f6ef" stroke="#9aa5b1" stroke-width="1.5"/><text x="301.0" y="95.9" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="600">conv 3×3, 16</text><text x="301.0" y="110.0" font-size="12" fill="#52606d" text-anchor="middle" font-weight="400">ReLU, pool 2×2</text><text x="301.0" y="125.0" font-size="12" fill="#52606d" text-anchor="middle" font-weight="400">16 × W/2 × 16</text><line x1="386" y1="98" x2="412" y2="98" stroke="#52606d" stroke-width="1.6" marker-end="url(#ah)"/><rect x="412" y="60" width="170" height="76" rx="8" fill="#e6f6ef" stroke="#9aa5b1" stroke-width="1.5"/><text x="497.0" y="95.9" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="600">conv 3×3, 32</text><text x="497.0" y="110.0" font-size="12" fill="#52606d" text-anchor="middle" font-weight="400">ReLU, pool 2×1</text><text x="497.0" y="125.0" font-size="12" fill="#52606d" text-anchor="middle" font-weight="400">8 × W/2 × 32</text><line x1="582" y1="98" x2="608" y2="98" stroke="#52606d" stroke-width="1.6" marker-end="url(#ah)"/><rect x="608" y="60" width="170" height="76" rx="8" fill="#e6f6ef" stroke="#9aa5b1" stroke-width="1.5"/><text x="693.0" y="95.9" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="600">conv 3×3, 64</text><text x="693.0" y="110.0" font-size="12" fill="#52606d" text-anchor="middle" font-weight="400">ReLU, pool 2×1</text><text x="693.0" y="125.0" font-size="12" fill="#52606d" text-anchor="middle" font-weight="400">4 × W/2 × 64</text><line x1="778" y1="98" x2="804" y2="98" stroke="#52606d" stroke-width="1.6" marker-end="url(#ah)"/><rect x="804" y="60" width="170" height="76" rx="8" fill="#e6f6ef" stroke="#9aa5b1" stroke-width="1.5"/><text x="889.0" y="95.9" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="600">conv 3×3, 64</text><text x="889.0" y="110.0" font-size="12" fill="#52606d" text-anchor="middle" font-weight="400">ReLU</text><text x="889.0" y="125.0" font-size="12" fill="#52606d" text-anchor="middle" font-weight="400">4 × W/2 × 64</text><line x1="900" y1="136" x2="900" y2="180" stroke="#52606d" stroke-width="1.6" marker-end="url(#ah)"/><text x="905" y="164" font-size="11" fill="#52606d" text-anchor="end" font-weight="400">flatten the 4 rows × 64 channels</text><rect x="800" y="190" width="180" height="76" rx="8" fill="#f5f7fa" stroke="#9aa5b1" stroke-width="1.5"/><text x="890.0" y="225.9" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="600">per frame</text><text x="890.0" y="240.0" font-size="12" fill="#52606d" text-anchor="middle" font-weight="400">T = W/2 frames</text><text x="890.0" y="255.0" font-size="12" fill="#52606d" text-anchor="middle" font-weight="400">256 numbers each</text><line x1="800" y1="228" x2="756" y2="228" stroke="#52606d" stroke-width="1.6" marker-end="url(#ah)"/><rect x="576" y="190" width="180" height="76" rx="8" fill="#f3ecfd" stroke="#9aa5b1" stroke-width="1.5"/><text x="666.0" y="225.9" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="600">BiGRU</text><text x="666.0" y="240.0" font-size="12" fill="#52606d" text-anchor="middle" font-weight="400">96 forward + 96 backward</text><text x="666.0" y="255.0" font-size="12" fill="#52606d" text-anchor="middle" font-weight="400">→ 192 per frame</text><line x1="576" y1="228" x2="532" y2="228" stroke="#52606d" stroke-width="1.6" marker-end="url(#ah)"/><rect x="352" y="190" width="180" height="76" rx="8" fill="#fdf1e3" stroke="#9aa5b1" stroke-width="1.5"/><text x="442.0" y="225.9" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="600">linear 192 → C</text><text x="442.0" y="240.0" font-size="12" fill="#52606d" text-anchor="middle" font-weight="400">log-softmax</text><text x="442.0" y="255.0" font-size="12" fill="#52606d" text-anchor="middle" font-weight="400">C = 120 classes (with blank)</text><line x1="352" y1="228" x2="308" y2="228" stroke="#52606d" stroke-width="1.6" marker-end="url(#ah)"/><rect x="128" y="190" width="180" height="76" rx="8" fill="#fdf1e3" stroke="#9aa5b1" stroke-width="1.5"/><text x="218.0" y="225.9" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="600">CTC decoding</text><text x="218.0" y="240.0" font-size="12" fill="#52606d" text-anchor="middle" font-weight="400">prefix beam search</text><text x="218.0" y="255.0" font-size="12" fill="#52606d" text-anchor="middle" font-weight="400">+ lexicon bonus</text><text x="20" y="310" font-size="12" fill="#52606d" text-anchor="start" font-weight="400">Parameters: convolutions 60,224 · BiGRU 203,904 · output 23,160 · total 287,288 per member; three members form the ensemble.</text><text x="20" y="330" font-size="12" fill="#52606d" text-anchor="start" font-weight="400">Height is squeezed 32 → 4 by pooling, width only halved: the width is time, and CTC needs frames to spare between repeated letters.</text><text x="20" y="350" font-size="12" fill="#52606d" text-anchor="start" font-weight="400">No normalisation layers, no dropout: the strip is already normalised (x-height, baseline, contrast) before it enters.</text></svg>
