<svg xmlns="http://www.w3.org/2000/svg" width="976" height="170" viewBox="0 0 976 170" font-family="Helvetica, Arial, sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52606d"/></marker></defs><rect width="976" height="170" fill="#ffffff"/><text x="20" y="26" font-size="16" fill="#1f2933" text-anchor="start" font-weight="700">Table separator network (sepnet_v2, 44,162 parameters)</text><rect x="20" y="46" width="160" height="64" rx="8" fill="#e8f0fe" stroke="#9aa5b1" stroke-width="1.5"/><text x="100.0" y="75.9" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="600">table crop</text><text x="100.0" y="90.0" font-size="12" fill="#52606d" text-anchor="middle" font-weight="400">grey, 75 dpi</text><text x="100.0" y="105.0" font-size="12" fill="#52606d" text-anchor="middle" font-weight="400">ink = 1 − grey</text><line x1="180" y1="78.0" x2="212" y2="78.0" stroke="#52606d" stroke-width="1.6" marker-end="url(#ah)"/><rect x="214" y="46" width="160" height="64" rx="8" fill="#e6f6ef" stroke="#9aa5b1" stroke-width="1.5"/><text x="294.0" y="75.9" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="600">4 × conv 3×3</text><text x="294.0" y="90.0" font-size="12" fill="#52606d" text-anchor="middle" font-weight="400">dilation 1,2,4,8</text><text x="294.0" y="105.0" font-size="12" fill="#52606d" text-anchor="middle" font-weight="400">16,32,32,32 ch</text><line x1="374" y1="78.0" x2="406" y2="78.0" stroke="#52606d" stroke-width="1.6" marker-end="url(#ah)"/><rect x="408" y="46" width="160" height="64" rx="8" fill="#f5f7fa" stroke="#9aa5b1" stroke-width="1.5"/><text x="488.0" y="75.9" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="600">pool per axis</text><text x="488.0" y="90.0" font-size="12" fill="#52606d" text-anchor="middle" font-weight="400">[mean, max] down</text><text x="488.0" y="105.0" font-size="12" fill="#52606d" text-anchor="middle" font-weight="400">columns / along rows</text><line x1="568" y1="78.0" x2="600" y2="78.0" stroke="#52606d" stroke-width="1.6" marker-end="url(#ah)"/><rect x="602" y="46" width="160" height="64" rx="8" fill="#e6f6ef" stroke="#9aa5b1" stroke-width="1.5"/><text x="682.0" y="75.9" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="600">conv1d k5 ×2</text><text x="682.0" y="90.0" font-size="12" fill="#52606d" text-anchor="middle" font-weight="400">32 → 1, per axis</text><text x="682.0" y="105.0" font-size="12" fill="#52606d" text-anchor="middle" font-weight="400">own weights</text><line x1="762" y1="78.0" x2="794" y2="78.0" stroke="#52606d" stroke-width="1.6" marker-end="url(#ah)"/><rect x="796" y="46" width="160" height="64" rx="8" fill="#fdf1e3" stroke="#9aa5b1" stroke-width="1.5"/><text x="876.0" y="75.9" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="600">sigmoid</text><text x="876.0" y="90.0" font-size="12" fill="#52606d" text-anchor="middle" font-weight="400">P(column sep) per x</text><text x="876.0" y="105.0" font-size="12" fill="#52606d" text-anchor="middle" font-weight="400">P(row sep) per y</text><text x="20" y="144" font-size="12" fill="#52606d" text-anchor="start" font-weight="400">Used as evidence: two rows join into one wrapped row where it sees no row separator between them.</text></svg>
