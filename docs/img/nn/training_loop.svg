<svg xmlns="http://www.w3.org/2000/svg" width="820" height="290" viewBox="0 0 820 290" font-family="Helvetica, Arial, sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52606d"/></marker></defs><rect width="820" height="290" fill="#ffffff"/><text x="20" y="28" font-size="16" fill="#1f2933" text-anchor="start" font-weight="700">Training: forward, measure the loss, send the blame backward, nudge every weight</text><rect x="20" y="100" width="140" height="60" rx="8" fill="#e8f0fe" stroke="#9aa5b1" stroke-width="1.5"/><text x="90.0" y="127.9" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="600">batch</text><text x="90.0" y="142.0" font-size="12" fill="#52606d" text-anchor="middle" font-weight="400">inputs x, targets y</text><rect x="200" y="100" width="150" height="60" rx="8" fill="#e6f6ef" stroke="#9aa5b1" stroke-width="1.5"/><text x="275.0" y="127.9" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="600">forward</text><text x="275.0" y="142.0" font-size="12" fill="#52606d" text-anchor="middle" font-weight="400">ŷ = f(x; θ)</text><rect x="390" y="100" width="150" height="60" rx="8" fill="#fde8e8" stroke="#9aa5b1" stroke-width="1.5"/><text x="465.0" y="127.9" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="600">loss</text><text x="465.0" y="142.0" font-size="12" fill="#52606d" text-anchor="middle" font-weight="400">L(ŷ, y)</text><rect x="580" y="100" width="220" height="60" rx="8" fill="#fdf1e3" stroke="#9aa5b1" stroke-width="1.5"/><text x="690.0" y="127.9" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="600">update (Adam)</text><text x="690.0" y="142.0" font-size="12" fill="#52606d" text-anchor="middle" font-weight="400">θ ← θ − η · step(∂L/∂θ)</text><line x1="160" y1="130" x2="198" y2="130" stroke="#52606d" stroke-width="1.6" marker-end="url(#ah)"/><line x1="350" y1="130" x2="388" y2="130" stroke="#52606d" stroke-width="1.6" marker-end="url(#ah)"/><line x1="540" y1="130" x2="578" y2="130" stroke="#52606d" stroke-width="1.6" marker-end="url(#ah)"/><text x="559.0" y="124.0" font-size="11" fill="#52606d" text-anchor="middle" font-weight="400">∂L/∂θ</text><path d="M 465 160 Q 465 225 370 225 Q 275 225 275 162" stroke="#d64545" stroke-width="1.6" fill="none" marker-end="url(#ah)"/><text x="370" y="250" font-size="12" fill="#d64545" text-anchor="middle" font-weight="400">backpropagation: the chain rule, layer by layer, output back to input</text><path d="M 690 100 Q 690 60 480 60 Q 275 60 275 98" stroke="#1f9d6b" stroke-width="1.6" fill="none" marker-end="url(#ah)"/><text x="480" y="54" font-size="12" fill="#1f9d6b" text-anchor="middle" font-weight="400">the next batch, with the updated θ</text></svg>
