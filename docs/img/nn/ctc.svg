<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" font-family="Helvetica, Arial, sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52606d"/></marker></defs><rect width="900" height="300" fill="#ffffff"/><text x="20" y="28" font-size="16" fill="#1f2933" text-anchor="start" font-weight="700">CTC: the network emits a class per frame; repeats merge, blanks vanish</text><rect x="40" y="60" width="46" height="46" fill="#f5f7fa" stroke="#9aa5b1" stroke-width="1.0" fill-opacity="1.0"/><text x="63" y="90" font-size="18" fill="#52606d" text-anchor="middle" font-weight="600">–</text><text x="63" y="124" font-size="10" fill="#52606d" text-anchor="middle" font-weight="400">t0</text><rect x="92" y="60" width="46" height="46" fill="#e8f0fe" stroke="#9aa5b1" stroke-width="1.0" fill-opacity="1.0"/><text x="115" y="90" font-size="18" fill="#1f2933" text-anchor="middle" font-weight="600">h</text><text x="115" y="124" font-size="10" fill="#52606d" text-anchor="middle" font-weight="400">t1</text><rect x="144" y="60" width="46" height="46" fill="#e8f0fe" stroke="#9aa5b1" stroke-width="1.0" fill-opacity="1.0"/><text x="167" y="90" font-size="18" fill="#1f2933" text-anchor="middle" font-weight="600">h</text><text x="167" y="124" font-size="10" fill="#52606d" text-anchor="middle" font-weight="400">t2</text><rect x="196" y="60" width="46" height="46" fill="#f5f7fa" stroke="#9aa5b1" stroke-width="1.0" fill-opacity="1.0"/><text x="219" y="90" font-size="18" fill="#52606d" text-anchor="middle" font-weight="600">–</text><text x="219" y="124" font-size="10" fill="#52606d" text-anchor="middle" font-weight="400">t3</text><rect x="248" y="60" width="46" height="46" fill="#e8f0fe" stroke="#9aa5b1" stroke-width="1.0" fill-opacity="1.0"/><text x="271" y="90" font-size="18" fill="#1f2933" text-anchor="middle" font-weight="600">e</text><text x="271" y="124" font-size="10" fill="#52606d" text-anchor="middle" font-weight="400">t4</text><rect x="300" y="60" width="46" height="46" fill="#f5f7fa" stroke="#9aa5b1" stroke-width="1.0" fill-opacity="1.0"/><text x="323" y="90" font-size="18" fill="#52606d" text-anchor="middle" font-weight="600">–</text><text x="323" y="124" font-size="10" fill="#52606d" text-anchor="middle" font-weight="400">t5</text><rect x="352" y="60" width="46" height="46" fill="#e8f0fe" stroke="#9aa5b1" stroke-width="1.0" fill-opacity="1.0"/><text x="375" y="90" font-size="18" fill="#1f2933" text-anchor="middle" font-weight="600">l</text><text x="375" y="124" font-size="10" fill="#52606d" text-anchor="middle" font-weight="400">t6</text><rect x="404" y="60" width="46" height="46" fill="#e8f0fe" stroke="#9aa5b1" stroke-width="1.0" fill-opacity="1.0"/><text x="427" y="90" font-size="18" fill="#1f2933" text-anchor="middle" font-weight="600">l</text><text x="427" y="124" font-size="10" fill="#52606d" text-anchor="middle" font-weight="400">t7</text><rect x="456" y="60" width="46" height="46" fill="#f5f7fa" stroke="#9aa5b1" stroke-width="1.0" fill-opacity="1.0"/><text x="479" y="90" font-size="18" fill="#52606d" text-anchor="middle" font-weight="600">–</text><text x="479" y="124" font-size="10" fill="#52606d" text-anchor="middle" font-weight="400">t8</text><rect x="508" y="60" width="46" height="46" fill="#f5f7fa" stroke="#9aa5b1" stroke-width="1.0" fill-opacity="1.0"/><text x="531" y="90" font-size="18" fill="#52606d" text-anchor="middle" font-weight="600">–</text><text x="531" y="124" font-size="10" fill="#52606d" text-anchor="middle" font-weight="400">t9</text><rect x="560" y="60" width="46" height="46" fill="#e8f0fe" stroke="#9aa5b1" stroke-width="1.0" fill-opacity="1.0"/><text x="583" y="90" font-size="18" fill="#1f2933" text-anchor="middle" font-weight="600">l</text><text x="583" y="124" font-size="10" fill="#52606d" text-anchor="middle" font-weight="400">t10</text><rect x="612" y="60" width="46" height="46" fill="#f5f7fa" stroke="#9aa5b1" stroke-width="1.0" fill-opacity="1.0"/><text x="635" y="90" font-size="18" fill="#52606d" text-anchor="middle" font-weight="600">–</text><text x="635" y="124" font-size="10" fill="#52606d" text-anchor="middle" font-weight="400">t11</text><rect x="664" y="60" width="46" height="46" fill="#e8f0fe" stroke="#9aa5b1" stroke-width="1.0" fill-opacity="1.0"/><text x="687" y="90" font-size="18" fill="#1f2933" text-anchor="middle" font-weight="600">o</text><text x="687" y="124" font-size="10" fill="#52606d" text-anchor="middle" font-weight="400">t12</text><rect x="716" y="60" width="46" height="46" fill="#e8f0fe" stroke="#9aa5b1" stroke-width="1.0" fill-opacity="1.0"/><text x="739" y="90" font-size="18" fill="#1f2933" text-anchor="middle" font-weight="600">o</text><text x="739" y="124" font-size="10" fill="#52606d" text-anchor="middle" font-weight="400">t13</text><rect x="768" y="60" width="46" height="46" fill="#f5f7fa" stroke="#9aa5b1" stroke-width="1.0" fill-opacity="1.0"/><text x="791" y="90" font-size="18" fill="#52606d" text-anchor="middle" font-weight="600">–</text><text x="791" y="124" font-size="10" fill="#52606d" text-anchor="middle" font-weight="400">t14</text><text x="40" y="158" font-size="13" fill="#1f2933" text-anchor="start" font-weight="400">1. merge repeated classes:</text><text x="300" y="158" font-size="15" fill="#1f2933" text-anchor="start" font-weight="600">– h – e – l – l – o –</text><text x="40" y="190" font-size="13" fill="#1f2933" text-anchor="start" font-weight="400">2. drop the blanks:</text><text x="300" y="190" font-size="15" fill="#1f2933" text-anchor="start" font-weight="600">h e l l o</text><text x="40" y="232" font-size="12" fill="#52606d" text-anchor="start" font-weight="400">The blank between the two l's is what lets a double letter survive: 'll' with no blank between would merge into one 'l'.</text><text x="40" y="254" font-size="12" fill="#52606d" text-anchor="start" font-weight="400">Training sums the probability of every frame path that collapses to the truth (the forward algorithm), so no one</text><text x="40" y="272" font-size="12" fill="#52606d" text-anchor="start" font-weight="400">has to mark where each character is: the line's text is the whole label.</text></svg>
