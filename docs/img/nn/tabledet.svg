<svg xmlns="http://www.w3.org/2000/svg" width="998" height="170" viewBox="0 0 998 170" font-family="Helvetica, Arial, sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52606d"/></marker></defs><rect width="998" height="170" fill="#ffffff"/><text x="20" y="26" font-size="16" fill="#1f2933" text-anchor="start" font-weight="700">Table detector (tabledet_v1, 247,746 parameters)</text><rect x="20" y="46" width="138" height="64" rx="8" fill="#e8f0fe" stroke="#9aa5b1" stroke-width="1.5"/><text x="89.0" y="75.9" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="600">whole page</text><text x="89.0" y="90.0" font-size="12" fill="#52606d" text-anchor="middle" font-weight="400">ink + word boxes</text><text x="89.0" y="105.0" font-size="12" fill="#52606d" text-anchor="middle" font-weight="400">37.5 dpi (319×412)</text><line x1="158" y1="78.0" x2="182" y2="78.0" stroke="#52606d" stroke-width="1.6" marker-end="url(#ah)"/><rect x="184" y="46" width="138" height="64" rx="8" fill="#e6f6ef" stroke="#9aa5b1" stroke-width="1.5"/><text x="253.0" y="75.9" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="600">stem 3×3</text><text x="253.0" y="90.0" font-size="12" fill="#52606d" text-anchor="middle" font-weight="400">2 → 16, ReLU</text><text x="253.0" y="105.0" font-size="12" fill="#52606d" text-anchor="middle" font-weight="400">(kept as skip)</text><line x1="322" y1="78.0" x2="346" y2="78.0" stroke="#52606d" stroke-width="1.6" marker-end="url(#ah)"/><rect x="348" y="46" width="138" height="64" rx="8" fill="#e6f6ef" stroke="#9aa5b1" stroke-width="1.5"/><text x="417.0" y="75.9" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="600">conv 3×3 /2</text><text x="417.0" y="90.0" font-size="12" fill="#52606d" text-anchor="middle" font-weight="400">16 → 48, ReLU</text><line x1="486" y1="78.0" x2="510" y2="78.0" stroke="#52606d" stroke-width="1.6" marker-end="url(#ah)"/><rect x="512" y="46" width="138" height="64" rx="8" fill="#f3ecfd" stroke="#9aa5b1" stroke-width="1.5"/><text x="581.0" y="75.9" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="600">8 blocks</text><text x="581.0" y="90.0" font-size="12" fill="#52606d" text-anchor="middle" font-weight="400">dilations 1,2,4,8,</text><text x="581.0" y="105.0" font-size="12" fill="#52606d" text-anchor="middle" font-weight="400">16,1,2,4 + pooling</text><line x1="650" y1="78.0" x2="674" y2="78.0" stroke="#52606d" stroke-width="1.6" marker-end="url(#ah)"/><rect x="676" y="46" width="138" height="64" rx="8" fill="#e6f6ef" stroke="#9aa5b1" stroke-width="1.5"/><text x="745.0" y="75.9" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="600">upsample ×2</text><text x="745.0" y="90.0" font-size="12" fill="#52606d" text-anchor="middle" font-weight="400">concat stem → 64</text><text x="745.0" y="105.0" font-size="12" fill="#52606d" text-anchor="middle" font-weight="400">conv 3×3 → 32</text><line x1="814" y1="78.0" x2="838" y2="78.0" stroke="#52606d" stroke-width="1.6" marker-end="url(#ah)"/><rect x="840" y="46" width="138" height="64" rx="8" fill="#fdf1e3" stroke="#9aa5b1" stroke-width="1.5"/><text x="909.0" y="75.9" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="600">1×1 → 2</text><text x="909.0" y="90.0" font-size="12" fill="#52606d" text-anchor="middle" font-weight="400">P(inside a table)</text><text x="909.0" y="105.0" font-size="12" fill="#52606d" text-anchor="middle" font-weight="400">P(border band)</text><text x="20" y="144" font-size="12" fill="#52606d" text-anchor="start" font-weight="400">A table is a component of 'inside and not border': the border band keeps two tables that touch apart.</text></svg>
