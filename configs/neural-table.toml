# The NEURAL-TABLE engine: configs/neural.toml for table documents -- payroll
# forms, paystubs, timesheets, statements, invoices, receipts.  The neural
# profile already reports table structure (the output-only table options);
# this one adds the table options that also change what the reader sees,
# kept out of neural so its measurements stand (the owner's decision,
# 2026-09-28):
#   imagezones.keep_grids   a large ruled grid is a table, not a picture
#   rulings.short_in_grid   rules too short for the length test that end on rules
#   magnify.max_scale 4.2   a 72-dpi table crop is brought up to 300 dpi
#   output.table_net_path   the self-trained separator network joins wrapped rows
#   tables.diagonals        a diagonal rule in a cell erased, the cell's words split upper / lower
#   output.ws_detector      tables found as meshes of the junction graph (whitespace and
#                           rules as one set of lines; the owner's idea, 2026-09-28)
# Measured (docs/RESEARCH.md): payroll forms 0.717 TEDS, paystubs 0.793,
# invoices 0.711, timesheets 0.604, receipts 0.624; on text, dev-8 and
# legal-8 unchanged, SROIE -0.1 / -0.3, FUNSD +0.4 / -0.1.
#
# The NEURAL engine: configs/classic.toml plus the heavier self-trained
# networks, each added here only when it has been adopted on all four
# evaluation sets (docs/RESEARCH.md records the measurement).  Every network
# is trained by this repository on public data, on home hardware, and enters
# the pipeline as a gated additive term, so this file differs from
# classic.toml only in [stage.recognize] and [stage.decode] parameters.
#
# Adopted terms:
#   decode.seq_*   the word-strip CRNN + CTC scorer (2026-09-09): each word's
#                  segmentation variants are rescored by -log P(text | word
#                  window), and the scorer's own reading joins the variants
#                  when the lexicon or a numeric format endorses it and its
#                  likelihood beats the decoder's best by 3 nats.  Measured
#                  against classic: dev-8 95.1/88.8 -> 95.8/90.6, broad-30
#                  91.7/81.4 -> 92.8/85.0, legal-8 91.3/79.6 -> 91.3/81.0,
#                  modern 84.7/72.3 -> 86.0/76.3 (docs/RESEARCH.md).
# Planned terms (docs/ROADMAP.md): recognize.piece_cnn_path (partial-shape
# classifier for cut pieces), decode.abs_quality_mode = "calibrated".

[pipeline]
stages = ["magnify", "deskew", "illumination", "binarize", "despeckle",
          "imagezones", "rulings", "blocks", "tables", "lines",
          "components", "recognize", "decode", "adapt", "decode", "correct", "output"]

[stage.magnify]
impl = "xheight"
max_scale = 4.2                # table profile: a 72-dpi crop (FinTabNet) needs x4.2 to reach 300 dpi
target_px = 0                  # median glyph height to magnify small-type pages up to (0 = off; measured 2026-09-20)
min_dpi = 200                  # a page declared below 200 dpi is resampled to 300 (2026-09-25: a 150-dpi paper scan 0.57 -> 0.81 mean word confidence; no evaluation page declares under 209)

[stage.deskew]
impl = "projection"
text_ink = "limit"   # an estimate at the search limit is re-made from glyph-sized ink, and left at 0 if it
                     # lands there again: a photograph had rotated straight magazine pages 5 degrees
                     # (held-out magazines neural 77.1/65.3 -> 82.1/73.4, classic 65.4 -> 67.6; 2026-09-27)
max_angle = 5.0

[stage.illumination]
impl = "median_background"
frame_dark = 0.3   # clear a scanner's dark frame (a dark region touching three edges) to paper; 2026-09-22; 0.5 -> 0.3 on 2026-09-23 (shaded paper in a photo fell under 0.5)

[stage.binarize]
impl = "sauvola"
window = 41
k = 0.2

[stage.despeckle]
impl = "components"
min_area_300dpi = 5

[stage.imagezones]
impl = "density"
keep_grids = true              # table profile: a ruled grid is left to the rulings and tables stages
protect_text_rows = true       # glyph chains (and their punctuation) inside a picture zone go back to the text
                               # (2026-09-26): magazine captions and photo-side columns were swallowed; held-out
                               # magazines 68.1 -> 77.2 char, mag-8 80.6 -> 81.3, FUNSD 63.5 -> 64.5, the rest within 0.1

[stage.rulings]
impl = "morphological"
short_in_grid_300dpi = 40      # table profile: dividers under spanned headers, both ends on rules
dash_gap_300dpi = 12           # dashed and fax-broken rules too (form fill-in lines and underlines):
                               # FUNSD +1.4 char, CORD +1.1 / +2.9 word, SROIE +3.1 word, the rest level
                               # (2026-09-26)

[stage.tables]
impl = "grid"
min_row_ink = 0.03             # table profile: a grid with no row of text is a chart's axes and bars, not a table
diagonals = true               # table profile: a cell split by a diagonal rule: the line erased before reading, the words split by side
# table structure, output only (the owner's decision, 2026-09-28): these change
# the tables the page reports, never its text (docs/RESEARCH.md; the table
# options that DO change the text are in configs/neural-table.toml)
spans = true                   # cells merged across unruled borders: rowspan / colspan
open_sides = true              # a table open at a side gets the columns its row rules bound
nested = true                  # a ruled table inside a ruled frame's cell is nested in the output

[stage.blocks]
impl = "judged"                # newspapers and magazines: XY-cut or knn_scc chosen per page by a judge
                               # (layout/segjudge.py; held-out news 79.7 -> 84.3, magazines 65.9 -> 67.8,
                               # 2026-09-26); every other page XY-cut exactly as before

[stage.lines]
impl = "profile"

[stage.components]
impl = "overlap"

[stage.recognize]
impl = "prototypes"

[stage.decode]
lm_contractions = true         # the lexicon endorses stem + clitic (we'll, you'll, we're, I'm): it lacked them, and
                               # the decoder dropped the apostrophe for 'well', 'were' (blocks 96.0 -> 96.1 word;
                               # mag-8 +0.2, broad-30, news-8, held-out news and letters +0.1 word; none down)
sentence_case_seq_veto = true  # the sentence-case pass no longer lowercases a word the reader read with its
                               # capital ('President', 'Board', 'October' mid-sentence): blocks 95.9 -> 96.0
                               # word (case errors 15 -> 10), news-8 and held-out letters +0.1, the rest level
anchor_min_frac = 0.4          # rows of underline dashes no longer set the page's lowercase anchor (a
                               # form's caps lines had taken a 3.6 px x-height and been deleted as slivers):
                               # CORD +7.0 / +9.2, FUNSD +1.2 / +1.1, the rest within 0.2 (2026-09-26)
impl = "hybrid"                # the line reader beside the classic decoder (decode/lineread.py,
                               # 2026-09-13): every line is also read end to end and a line the
                               # classic decoder read differently takes the reading when the fitted
                               # judge says so (2026-09-13: dev-8 91.9 -> 93.2 word, broad-30 87.5 -> 89.8,
                               # legal-8 84.4 -> 88.5, news-8 88.2 -> 90.2, blocks broad-30 91.1 -> 95.1).
                               # "beam" is the classic decoder alone.
line_model_path = "data/seq_line_gray9_en.npz+data/seq_line_gray9_en_2.npz+data/seq_line_gray9_en_3.npz"
                               # = seq_line_gray9 (2026-09-27, v0.15.0): each v0.14.0 member below with the alphabet
                               # widened by * = + @ [ ] _ ` (output rows kept by name), 3 more epochs on its data plus a
                               # symbol-bearing synthetic set, distilled from itself (lines needing a new class not
                               # distilled), L2-SP 1e-4, EMA: SROIE 78.6/60.2 -> 79.5/62.4, dev-8 +0.3 word, blocks
                               # (with the join fix) 96.1 -> 97.2 word; legal-8 -0.2, mag-8 -0.2 word. v0.14.0's reader:
                               # = seq_line_gray7 seeds 3, 2, 1, EMA weights (2026-09-27, v0.14.0): each member below
                               # fine-tuned 4 more epochs with grey SROIE (30,323) and FUNSD (6,598) box-cut training lines
                               # added, grey Legal Reports lines from all 600 harvest pages (x3), CORD x10; L2-SP (1e-4)
                               # towards the member it started from and Learning without Forgetting (KL from it, T 2, on
                               # every line but the new box-cut ones); the EMA (0.999) of the weights is what ships.
                               # Against it, with case repair: SROIE 68.2/47.6 -> 78.6/60.2, CORD 52.4/30.6 -> 51.8/29.3,
                               # Legal Reports 87.6/74.1 -> 87.6/73.8, nothing else down more than 0.4 word (RESEARCH).
                               # Previous (v0.13.0): seq_line_gray_en*.npz =
                               # seq_line_gray2 seeds 3, 2, 1 (2026-09-26): each v17a member fine-tuned 8 epochs on GREY
                               # line strips (grey twins of 24,739 harvested lines + 1,135 Legal Reports lines) plus the
                               # binary SROIE / Legal Reports / FUNSD line files; read with line_source = "gray". Against
                               # v17a: CORD cropped 37.7/8.0 -> 46.4/21.7, FUNSD 57.8/33.6 -> 63.5/41.8, Legal Reports
                               # 85.5/69.9 -> 87.6/74.2, SROIE 68.3/39.7 -> 67.3/43.6, business +0.4/+1.7, broad-30 +0.4/+0.7,
                               # legal-8 -0.5/-0.3. Previous live: seq_line_v17a (seq_line_en*.npz, binary strips).
line_source = "gray"           # the reader's strips cut from the flattened grey page, contrast-normalised
                               # (glyph/strip.py gray_contrast): faint thermal and dot-matrix print survives
line_mode = "choose"
line_choose_rule = "calibrated"  # the fitted judge (decode/linechoice.py). Until 2026-09-18 a fall-through in the
                               # choice chain overwrote its decision with the endorsed count; with the judge
                               # deciding: dev-8 93.4 -> 94.5 word, broad-30 90.2 -> 91.0, legal-8 89.1 -> 90.2,
                               # modern 88.8 -> 90.5, business 93.6 -> 95.1; mag-8 -3, blocks -1 char
line_choice_path = "data/linechoice.npz"  # = linechoice_v17as (2026-09-24), kept for the grey ensemble: a judge refitted
                               # on its own pairs cost mag-8 4 points (2026-09-26); fitted on the v17a ensemble's own line pairs
                               # (the four UNLV harvests + receipt pairs, page-level feature); 80.3% decision accuracy.
                               # Previous: linechoice_e15s
line_choice_thresh = 0.5
line_max_cols = 1400
line_read_graphic = true       # the reader reads the lines the classic decoder flagged as graphics
                               # (letterheads in display faces) and keeps a confident, endorsed
                               # reading (2026-09-14: legal-8 88.5 -> 89.1 word, dev-8 +0.4 char,
                               # broad-30 +0.5 char; 49 of 118 flagged letterhead lines rescued)
line_keep_superset = true      # the reader's text = the classic text minus characters, every classic word
line_drop_declined = 0.5       # a line the reader declines whose classic words carry no endorsement and whose x-height is under half the page median is dropped (dashed rules and specks; receipts +0.4, forms +0.7, Legal Reports +0.8 word; 2026-09-22)
                               # endorsed -> keep classic ('TAX 8.25%' vs 'TAX 8.25'; 2026-09-17: receipts
                               # 91.3 -> 92.3 word, dev-8 +0.1, the rest identical)
line_join_spaced_alpha = true  # ...runs of LETTERS only: '3 x 5' (0.9 x-height gaps) had been joined into '3x5',
                               # 21 times on broad-30's zones (blocks +1.0 word, broad-30 page 92.0 -> 93.0 word)
line_join_spaced = true        # letter-spaced display type read as single letters is re-joined into
                               # lexicon words (2026-09-14: broad-30 89.7 -> 90.2 word; other sets flat)
qty_at_repair = true           # a receipt quantity line "2 e 2.72" -> "2 @ 2.72" by its shape (2026-09-16:
                               # receipts 94.8/87.0 -> 95.6/90.1; four sets identical; the '@' class itself lost)
digit_kern_join = true         # a lone digit joins the digit token across a kerning gap, "1 0/15/2024" -> "10/15/2024"
                               # (2026-09-17: payslips 84.0 -> 84.6 word, invoices 87.2 -> 87.7; four sets identical)
digit_kern_gap = 0.75          # the kerning gap in x-heights (2026-09-17: 0.5 missed a '1' 0.7 x-heights from its digits;
                               # 0.75 took business 92.6 -> 93.4 word neural, recall and precision up; UNLV sets identical)
caps_page_repair = true        # a page >= 90% capitals (receipt roll): mixed-case words upper-cased
                               # (2026-09-17: receipts 95.6/90.1 -> 96.3/91.3; never fires on the four sets)
seq_path = "data/seq_en.npz"   # = seq_en_v6c_s2 (2026-09-13): the 615-face scorer fine-tuned on five real
                               # harvests (bus.3B, legal, bus.3A, news, mag) at real weight 3; "" = classic decoding
seq_backend = "auto"           # numpy (torch/MPS is launch-bound one window at a time: +5 s a page); "torch" to force it
seq_weight = 0.5
seq_inject = true
seq_inject_endorsed = true
seq_beam_weight = 1.0          # the beam's n-best rescored by the word window before
                               # the lexicon pass (2026-09-09: +1.2 word on broad-30,
                               # +2.7 on legal-8, +1.0 on modern, +0.7 on dev-8)
seq_reread = true              # a segment whose words are mostly unendorsed junk is
                               # re-read by the scorer and split at its space emissions
                               # (2026-09-09: broad-30 +0.3 word, recall +0.6; modern
                               # +0.2; legal-8 +0.1 word, -0.1 char; dev-8 flat)
doc_words = true               # the page's own word list: a scorer reading that recurs
                               # on the page, or agrees with the decoder, vouches for a
                               # word the lexicon does not know (2026-09-09: legal-8
                               # +0.5 word, broad-30 +0.3, modern +0.2, dev-8 +0.1)
conf_path = "data/wordconf.npz"   # calibrated word confidence (decode/wordconf.py):
                                  # each word gets p_correct; the output summary counts
                                  # review candidates below review_below (2026-09-10:
                                  # dev-8 keep p>=0.9 -> 91% of words kept at 98.0%
                                  # right, from 94.4% with no reject path)
review_below = 0.8


[stage.correct]
impl = "noisy_channel"   # OPTIONAL: a learned OCR-aware dictionary pass over the unknown words
enabled = false          # (decode/correct.py); switch on here, in the workbench, or with --set correct.enabled=true
confusions_path = "data/confusions_neural.json"
case_repair = true      # I/l and case-twin repair runs even with the corrector off (decode/correct.py
                        # case_repair; 2026-09-27): the receipt-trained reader leans to capitals ('Iong', 'DOg');
                        # CORD +0.3/+0.5, FUNSD +0.2 word, the rest level or +0.1

[stage.output]
drop_facing_page = true     # the facing page's column clipped at a spread's edge is left out (newspaper and
                            # magazine pages; 2026-09-27: news-8 +1.5 / +1.8, mag-8 +5.8 / +6.5 neural, RESEARCH)
impl = "text"
align_pair_min_rows = 2        # a text pair may form from two aligned rows (a table needs three) and takes the
                               # unpartnered one-line blocks on its columns' left edges; the higher-starting
                               # column reads first (2026-09-17: payslips 84.6 -> 89.3 word, orders 86.7 -> 92.3)
ws_mesh_min_spines = 2         # table profile: a mesh must close a cell (two spines sharing two row lines)
ws_detector = "mesh"           # table profile: tables found as meshes of E's in the junction graph (layout/junctions.py)
table_net_path = "data/sepnet_v2.npz"  # table profile: the separator network as row evidence (wrapped rows joined)
table_net_row_join = 0.2       # ...v2's threshold (v1 at 0.3; RESEARCH 2026-09-28)
split_words_at_cells = true    # table output only (2026-09-28): a word across ruled cell borders split at them
fix_figure_columns = true      # ...a misread cell in a column of figures repaired to a figure ('S 25' -> '$ 25')
check_arithmetic = true        # ...each table's figures checked against the relations it keeps (cells ok / fail)
ws_detect = true               # ...tables set by whitespace or ruled only between rows found on the page
align_two_col_max_gap = 0.25   # two TEXT columns of one-line cells more than a quarter page apart are a pair
                               # of blocks read column by column, not a table (2026-09-17: business invoices
                               # 87.7 -> 95.5 word neural, modern +1.0 word; a numeric column keeps a table)

[stage.adapt]
impl = "cluster_refit"
