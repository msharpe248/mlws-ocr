# The CLASSIC engine: the feature-based OCR as it stood on 2026-09-08 --
# structural glyph features, condensed nearest-prototype classification with
# the outline and graph-edit-distance opinions, per-document adaptation, and
# lattice decoding with a lexicon and character language model.  Its two
# networks are light and self-trained (the 53k-parameter MLP second opinion
# and the 258k-parameter character GRU); everything else is explicit.
#
# This profile is the reference the neural engine (configs/neural.toml) is
# measured against.  Its recognition never gains a network term: its
# scoreboard row in docs/DESIGN.md is the regression guard for every
# shared-stage change.  One exception, by the owner's decision (2026-09-25):
# the word corrector at the end ([stage.correct]) checks a proposed spelling
# against the word's image with the word scorer (data/seq_en.npz); set its
# seq_path = "" to run it on the dictionary alone.  Networks off entirely:
# configs/pure.toml.

[pipeline]
stages = ["magnify", "deskew", "illumination", "binarize", "despeckle",
          "imagezones", "rulings", "blocks", "tables", "lines",
          "components", "recognize", "decode", "adapt", "decode", "correct", "output"]

[stage.magnify]
impl = "xheight"
target_px = 0                  # median glyph height to magnify small-type pages up to (0 = off; measured 2026-09-20)

[stage.deskew]
impl = "projection"
max_angle = 5.0

[stage.illumination]
impl = "median_background"
frame_dark = 0.3   # clear a scanner's dark frame (a dark region touching three edges) to paper; 2026-09-22; 0.5 -> 0.3 on 2026-09-23 (shaded paper in a photo fell under 0.5)

[stage.binarize]
impl = "sauvola"
window = 41
k = 0.2

[stage.despeckle]
impl = "components"
min_area_300dpi = 5

[stage.imagezones]
impl = "density"

[stage.rulings]
impl = "morphological"

[stage.tables]
impl = "grid"

[stage.blocks]
impl = "xycut"

[stage.lines]
impl = "profile"

[stage.components]
impl = "overlap"

[stage.recognize]
impl = "prototypes"

[stage.decode]
impl = "beam"
digit_kern_join = true         # shape repairs shared with the neural profile (decode/formats.py), 2026-09-17:
digit_kern_gap = 0.75          # the kerning gap in x-heights (2026-09-17: 0.5 missed a '1' 0.7 x-heights from its digits;
                               # 0.75 took business 92.6 -> 93.4 word neural, recall and precision up; UNLV sets identical)
caps_page_repair = true        # business 90.3/79.7 -> 90.3/80.2 word; dev-8, broad-30, legal-8, modern identical


[stage.correct]
impl = "noisy_channel"   # a learned OCR-aware dictionary pass over the unknown words (decode/correct.py):
enabled = true           # classic broad-30 +0.43 word, modern +0.85, business +0.24; 1 wrong in 413 corrections
confusions_path = "data/confusions_classic.json"   # this engine's own confusions (scripts/harvest_confusions.py)
seq_path = "data/seq_en.npz"   # the image check: the word scorer must not prefer the original spelling

[stage.output]
impl = "text"

# [stage.chop]  impl = "unendorsed" -- word-level chopping between the decode
# passes; opt-in, measured inert until cut pieces get piece-aware scoring.
align_pair_min_rows = 2        # a text pair may form from two aligned rows (a table needs three) and takes the
                               # unpartnered one-line blocks on its columns' left edges; the higher-starting
                               # column reads first (2026-09-17: payslips 84.6 -> 89.3 word, orders 86.7 -> 92.3)
align_two_col_max_gap = 0.25   # two TEXT columns of one-line cells more than a quarter page apart are a pair
                               # of blocks read column by column, not a table (2026-09-17: business invoices
                               # 87.7 -> 95.5 word neural, modern +1.0 word; a numeric column keeps a table)

[stage.adapt]
impl = "cluster_refit"
