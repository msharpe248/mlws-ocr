# The CLASSIC engine: the feature-based OCR as it stood on 2026-09-08 --
# structural glyph features, condensed nearest-prototype classification with
# the outline and graph-edit-distance opinions, per-document adaptation, and
# lattice decoding with a lexicon and character language model.  Its two
# networks are light and self-trained (the 53k-parameter MLP second opinion
# and the 258k-parameter character GRU); everything else is explicit.
#
# This profile is the reference the neural engine (configs/neural.toml) is
# measured against.  It never gains a network term: its scoreboard row in
# docs/DESIGN.md is the regression guard for every shared-stage change.
# Networks off entirely: configs/pure.toml.

[pipeline]
stages = ["deskew", "illumination", "binarize", "despeckle",
          "imagezones", "rulings", "blocks", "tables", "lines",
          "components", "recognize", "decode", "adapt", "decode", "output"]

[stage.deskew]
impl = "projection"
max_angle = 5.0

[stage.illumination]
impl = "median_background"

[stage.binarize]
impl = "sauvola"
window = 41
k = 0.2

[stage.despeckle]
impl = "components"
min_area_300dpi = 5

[stage.imagezones]
impl = "density"

[stage.rulings]
impl = "morphological"

[stage.tables]
impl = "grid"

[stage.blocks]
impl = "xycut"

[stage.lines]
impl = "profile"

[stage.components]
impl = "overlap"

[stage.recognize]
impl = "prototypes"

[stage.decode]
impl = "beam"

[stage.output]
impl = "text"

# [stage.chop]  impl = "unendorsed" -- word-level chopping between the decode
# passes; opt-in, measured inert until cut pieces get piece-aware scoring.

[stage.adapt]
impl = "cluster_refit"
