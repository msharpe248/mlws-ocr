# The default engine: identical to configs/classic.toml (the feature-based
# engine with its two light networks), and it stays so until the neural
# profile beats it on every evaluation set.  Swap any stage's impl to compare
# algorithms; the inspector's diff view renders two runs side by side.
# tests/test_profiles.py asserts this file and classic.toml agree.

[pipeline]
stages = ["deskew", "illumination", "binarize", "despeckle",
          "imagezones", "rulings", "blocks", "tables", "lines",
          "components", "recognize", "decode", "adapt", "decode", "output"]

[stage.deskew]
impl = "projection"
max_angle = 5.0

[stage.illumination]
impl = "median_background"

[stage.binarize]
impl = "sauvola"
window = 41
k = 0.2

[stage.despeckle]
impl = "components"
min_area_300dpi = 5

[stage.imagezones]
impl = "density"

[stage.rulings]
impl = "morphological"

[stage.tables]
impl = "grid"

[stage.blocks]
impl = "xycut"

[stage.lines]
impl = "profile"

[stage.components]
impl = "overlap"

[stage.recognize]
impl = "prototypes"

[stage.decode]
impl = "beam"
digit_kern_join = true         # shape repairs shared with the neural profile (decode/formats.py), 2026-09-17:
caps_page_repair = true        # business 90.3/79.7 -> 90.3/80.2 word; dev-8, broad-30, legal-8, modern identical

[stage.output]
impl = "text"

# [stage.chop]  impl = "unendorsed" -- word-level chopping between the decode
# passes; opt-in, measured inert until cut pieces get piece-aware scoring.
align_two_col_max_gap = 0.25   # two TEXT columns of one-line cells more than a quarter page apart are a pair
                               # of blocks read column by column, not a table (2026-09-17: business invoices
                               # 87.7 -> 95.5 word neural, modern +1.0 word; a numeric column keeps a table)

[stage.adapt]
impl = "cluster_refit"
