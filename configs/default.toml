# Default cleanup pipeline. Swap any stage's impl to compare algorithms;
# the inspector's diff view renders two runs side by side.

[pipeline]
stages = ["deskew", "illumination", "binarize", "despeckle",
          "imagezones", "rulings", "blocks", "tables", "lines",
          "components", "recognize", "decode", "adapt", "decode", "output"]

[stage.deskew]
impl = "projection"
max_angle = 5.0

[stage.illumination]
impl = "median_background"

[stage.binarize]
impl = "sauvola"
window = 41
k = 0.2

[stage.despeckle]
impl = "components"
min_area_300dpi = 5

[stage.imagezones]
impl = "density"

[stage.rulings]
impl = "morphological"

[stage.tables]
impl = "grid"

[stage.blocks]
impl = "xycut"

[stage.lines]
impl = "profile"

[stage.components]
impl = "overlap"

[stage.recognize]
impl = "prototypes"

[stage.decode]
impl = "beam"

[stage.output]
impl = "text"

# [stage.chop]  impl = "unendorsed" -- word-level chopping between the decode
# passes; opt-in, measured inert until cut pieces get piece-aware scoring.

[stage.adapt]
impl = "cluster_refit"
