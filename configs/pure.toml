# The PURE engine: configs/classic.toml with no network at all.  The MLP
# second opinion is off (mlp_path = "") and the character GRU is off
# (char_lm = ""), so the decoder falls back to the corpus character n-gram.
# Kept so "how things were" can always be run and measured; every other
# stage is the classic engine's.  Scoreboard row in docs/DESIGN.md.

[pipeline]
stages = ["magnify", "deskew", "illumination", "binarize", "despeckle",
          "imagezones", "rulings", "blocks", "tables", "lines",
          "components", "recognize", "decode", "adapt", "decode", "correct", "output"]

[stage.magnify]
impl = "xheight"
target_px = 0                  # median glyph height to magnify small-type pages up to (0 = off; measured 2026-09-20)
min_dpi = 200                  # a page declared below 200 dpi is resampled to 300 (2026-09-25: a 150-dpi paper scan 0.57 -> 0.81 mean word confidence; no evaluation page declares under 209)

[stage.deskew]
impl = "projection"
max_angle = 5.0

[stage.illumination]
impl = "median_background"
frame_dark = 0.3   # clear a scanner's dark frame (a dark region touching three edges) to paper; 2026-09-22; 0.5 -> 0.3 on 2026-09-23 (shaded paper in a photo fell under 0.5)

[stage.binarize]
impl = "sauvola"
window = 41
k = 0.2

[stage.despeckle]
impl = "components"
min_area_300dpi = 5

[stage.imagezones]
impl = "density"

[stage.rulings]
impl = "morphological"

[stage.tables]
impl = "grid"

[stage.blocks]
impl = "xycut"

[stage.lines]
impl = "profile"

[stage.components]
impl = "overlap"

[stage.recognize]
impl = "prototypes"
mlp_path = ""          # no MLP second opinion

[stage.decode]
impl = "beam"
char_lm = ""           # no GRU: the corpus n-gram scores characters


[stage.correct]
impl = "noisy_channel"   # OPTIONAL: a learned OCR-aware dictionary pass over the unknown words
enabled = false          # (decode/correct.py); switch on here, in the workbench, or with --set correct.enabled=true
confusions_path = "data/confusions_classic.json"

[stage.output]
impl = "text"

[stage.adapt]
impl = "cluster_refit"
